[project]
name = "my-secretary"
version = "0.1.0"
description = "Push-to-talk dictation tray app for Windows: hold Ctrl+Alt, speak, and cleaned-up text is pasted at the caret."
authors = [
    { name = "Hewittt Trinh", email = "hewitt-trinh-2020@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "truststore>=0.10.4",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[project.scripts]
my-secretary = "my_secretary.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
